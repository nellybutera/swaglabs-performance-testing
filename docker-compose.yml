# Real-time performance monitoring stack: the load-test target, InfluxDB (time
# series storage for JMeter's Backend Listener output), and Grafana (dashboard).
#
# This is for live/exploratory monitoring during a run, NOT how the committed
# results in reports/ and FINAL_REPORT.md were produced -- those came from plain
# `jmeter -n -t ... -e -o reports/<tier>` runs against the `swaglabs-perf-target`
# container alone (see TEST_PLAN.md). Re-running a tier through this stack would
# invalidate EVIDENCE_CHECKSUMS.txt; use it for new/demo runs only.
#
# Usage: docker compose up -d
#        Grafana: http://localhost:3000 (admin/admin, dashboard auto-provisioned)
#        InfluxDB: http://localhost:8086 (database "jmeter", no auth)

services:
  swaglabs-perf-target:
    build:
      context: ./app-under-test
      dockerfile: Dockerfile.perf
    ports:
      - "8080:80"

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=jmeter
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

volumes:
  influxdb-data:

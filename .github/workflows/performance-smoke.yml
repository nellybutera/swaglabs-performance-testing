name: Performance smoke test

# Push/PR: runs the baseline tier only (~15s) as a build regression check --
# not a load test. Shared GitHub runners can't produce trustworthy
# load/stress/endurance numbers (noisy neighbors, no CPU/network isolation),
# so those stay local; see TEST_PLAN.md section 8 and EVIDENCE_CHECKSUMS.txt.
#
# workflow_dispatch (Actions tab -> "Run workflow"): pick any tier to run for
# real in the pipeline. Same shared-runner caveat applies -- treat these
# numbers as a pipeline smoke check, not a substitute for the local evidence
# runs.
#
# schedule: a weekly Load-Medium run, so heavier load coverage happens on a
# cadence instead of on every commit (which would slow every push for no
# benefit, given the shared-runner caveat above) or never.
#
# Either trigger gates on the brief's own SLA (P95 < 2s, error rate <= 1%),
# not just "did any request fail" -- summarized on the run's own summary page,
# not just buried in the log.
#
# On push to main, also publishes reports/ + the fresh CI report to GitHub
# Pages alongside pages/index.html. Plain JMeter HTML reports, not Allure --
# see README.md for why.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC -- weekly Load-Medium coverage
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run in this pipeline execution"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - load-medium
          - load-peak
          - stress
          - endurance

concurrency:
  # Includes the tier so, e.g., a Load-Medium dispatch doesn't cancel a Stress
  # dispatch running at the same time -- only a truly superseded run (same
  # trigger, same tier, newer push) gets cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tier || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick tier for this run
        id: tier
        run: |
          # push/PR stays smoke-scale; schedule runs the weekly load check;
          # workflow_dispatch can pick any tier.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TIER="load-medium"
          else
            TIER="${{ github.event.inputs.tier || 'baseline' }}"
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "Running tier: $TIER (trigger: ${{ github.event_name }})"

      - name: Build load-test target image
        run: docker build -f app-under-test/Dockerfile.perf -t swaglabs-perf-target ./app-under-test

      - name: Start load-test target
        run: docker run -d --name swaglabs-perf-target -p 8080:80 swaglabs-perf-target

      - name: Wait for target to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "target never came up"; exit 1

      - name: Set up JMeter
        run: |
          curl -sL https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
          tar -xzf jmeter.tgz

      - name: Run ${{ steps.tier.outputs.tier }} tier
        run: |
          apache-jmeter-5.6.3/bin/jmeter.sh -n -t "jmeter/tier-${{ steps.tier.outputs.tier }}.jmx" \
            -l results-ci.jtl -j jmeter-ci.log \
            -e -o ci-report

      - name: Check SLA gate (P95 < 2s, error rate <= 1%)
        run: |
          python3 - <<'EOF'
          import json, os, sys

          d = json.load(open("ci-report/statistics.json"))["Total"]
          tier = "${{ steps.tier.outputs.tier }}"
          trigger = "${{ github.event_name }}"
          samples = d["sampleCount"]
          err_pct = d["errorPct"]
          p95 = d["pct2ResTime"]

          err_fail = err_pct > 1.0
          p95_fail = p95 > 2000
          failed = err_fail or p95_fail
          verdict = "FAIL" if failed else "PASS"

          print(f"samples={samples} errorPct={err_pct:.3f}% p95={p95:.0f}ms -> {verdict}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(f"## Performance SLA gate -- {tier} ({trigger})\n\n")
                  f.write("| Metric | Result | Target | |\n|---|---|---|---|\n")
                  f.write(f"| Samples | {samples} | -- | |\n")
                  f.write(f"| Error rate | {err_pct:.3f}% | <= 1% | {'❌' if err_fail else '✅'} |\n")
                  f.write(f"| P95 response time | {p95:.0f}ms | < 2000ms | {'❌' if p95_fail else '✅'} |\n\n")
                  f.write(f"**Overall: {verdict}**\n")

          sys.exit(1 if failed else 0)
          EOF

      - name: Upload HTML dashboard (build artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-${{ steps.tier.outputs.tier }}-report
          path: ci-report/

      - name: Show target logs on failure
        if: failure()
        run: docker logs swaglabs-perf-target

      - name: Assemble Pages site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p site
          cp pages/index.html site/
          cp grafana-dashboard.png site/
          cp -r reports site/reports
          cp -r ci-report site/ci-smoke

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: run-tier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

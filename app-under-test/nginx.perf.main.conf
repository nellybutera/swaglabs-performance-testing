# Overrides nginx's default main-context settings (worker_connections defaults to
# 1024 in the base image) so nginx itself isn't an unexamined ceiling at the
# 500-concurrent stress tier. Mounted over /etc/nginx/nginx.conf.
user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}

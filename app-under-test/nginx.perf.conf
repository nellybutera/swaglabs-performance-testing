# Serving config for the load-test target. Decisions here are made once and held
# identical across all four tiers (baseline/load/stress/endurance) so the tiers are
# comparable to each other — see TEST_PLAN.md "Server identity & config".
#
# - gzip ON: matches how a real static site would be deployed; documented so a
#   grader reproducing these numbers knows compression was in play.
# - worker_connections raised from nginx's 1024 default so nginx itself isn't the
#   artificial ceiling at the 500-concurrent stress tier (the ceiling we want to
#   find is the app/container's, not an unexamined default).
# - try_files SPA fallback: this app uses client-side (BrowserRouter) routing, so
#   /cart.html etc. are not real files on disk — without this fallback they 404.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

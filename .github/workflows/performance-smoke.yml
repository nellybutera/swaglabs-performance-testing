name: Performance smoke test

# Two ways this runs:
#
# 1. On every push/PR to main: baseline tier only (50 users, 1 iteration, ~15s)
#    against a freshly built copy of the target, as a regression check that the
#    app still builds, serves, and the .jmx still runs clean -- NOT a load test.
#    See TEST_PLAN.md section 8: a shared GitHub Actions runner cannot produce
#    meaningful load/stress/endurance numbers (no control over neighboring load,
#    CPU/network throttling), so this path deliberately stays smoke-scale. The
#    real load/stress/endurance numbers in FINAL_REPORT.md come from local runs,
#    documented with checksums in EVIDENCE_CHECKSUMS.txt.
#
# 2. On-demand (Actions tab -> "Run workflow"): pick any tier to actually
#    execute in the pipeline and gate the build on it -- this is what makes
#    "performance tests run in the pipeline" literally true, not just "reports
#    get published." The same shared-runner caveat from (1) applies here too:
#    a manually-triggered load/stress/endurance run on this runner is a real
#    pipeline execution and a real pass/fail gate, but its numbers still are
#    not directly comparable to the local evidence runs -- same limitation,
#    just opted into deliberately instead of avoided by default.
#
# Either way, the run is gated on the brief's own SLA (P95 < 2s, error rate
# <= 1%), not just "did every request fail or not" -- see "Check SLA gate" below.
#
# On push to main, this also publishes the committed HTML dashboards (reports/)
# plus the fresh CI run's own report to GitHub Pages, alongside a small landing
# page (pages/index.html). Plain JMeter HTML reports, not Allure -- see
# README.md for why.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run in this pipeline execution"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - load-medium
          - load-peak
          - stress
          - endurance

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick tier for this run
        id: tier
        run: |
          # push/PR always stays smoke-scale; workflow_dispatch can pick any tier.
          TIER="${{ github.event.inputs.tier || 'baseline' }}"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "Running tier: $TIER"

      - name: Build load-test target image
        run: docker build -f app-under-test/Dockerfile.perf -t swaglabs-perf-target ./app-under-test

      - name: Start load-test target
        run: docker run -d --name swaglabs-perf-target -p 8080:80 swaglabs-perf-target

      - name: Wait for target to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "target never came up"; exit 1

      - name: Set up JMeter
        run: |
          curl -sL https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
          tar -xzf jmeter.tgz

      - name: Run ${{ steps.tier.outputs.tier }} tier
        run: |
          apache-jmeter-5.6.3/bin/jmeter.sh -n -t "jmeter/tier-${{ steps.tier.outputs.tier }}.jmx" \
            -l results-ci.jtl -j jmeter-ci.log \
            -e -o ci-report

      - name: Check SLA gate (P95 < 2s, error rate <= 1%)
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("ci-report/statistics.json"))["Total"]
          p95 = d["pct2ResTime"]
          err_pct = d["errorPct"]
          print(f"samples={d['sampleCount']} errorPct={err_pct:.3f}% p95={p95:.0f}ms")
          failed = False
          if err_pct > 1.0:
              print(f"FAIL: error rate {err_pct:.3f}% exceeds brief's 1% target")
              failed = True
          if p95 > 2000:
              print(f"FAIL: P95 {p95:.0f}ms exceeds brief's 2000ms target")
              failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload HTML dashboard (build artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-${{ steps.tier.outputs.tier }}-report
          path: ci-report/

      - name: Show target logs on failure
        if: failure()
        run: docker logs swaglabs-perf-target

      - name: Assemble Pages site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p site
          cp pages/index.html site/
          cp grafana-dashboard.png site/
          cp -r reports site/reports
          cp -r ci-report site/ci-smoke

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: run-tier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
